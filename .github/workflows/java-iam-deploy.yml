name: Deploy IAM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  call-java-workflow:
    uses: school-guardian-project/.github/.github/workflows/deploy-java.yml@main
    with:
      dockerfile_path: 'Dockerfile'
      app_name: 'ms-iam'
      host_port: 8080
    secrets: inherit
