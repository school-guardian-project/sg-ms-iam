spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_DATABASE};encrypt=false;trustServerCertificate=true
spring.datasource.username=${MSSQL_USER}
spring.datasource.password=${MSSQL_SA_PASSWORD}

# HikariCP connection pool tuning for login performance
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=ms-iam-pool

spring.jpa.properties.hibernate.default_schema=Iam

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Real client IP behind Caddy -> Kong. Tomcat's RemoteIpValve reads
# X-Forwarded-For only when the request comes from an internal proxy (private /
# Docker networks below) and walks the header right to left, so an address a
# client injects in X-Forwarded-For is never trusted. getRemoteAddr() then
# returns the real client for login sessions and terms acceptance evidence.
# Override with SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES (a Java regex) if the
# Docker network uses another range.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1

# SpringDoc / Scalar
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Scalar
scalar.enabled=true
scalar.path=/scalar
scalar.url=/api-docs
scalar.pageTitle=MS-IAM Authentication API

# JWT (RS256) — IAM signs tokens with a private key and publishes the matching
# public key as a JWKS at /.well-known/jwks.json so Kong can verify them without
# a shared secret. Provide JWT_PRIVATE_KEY and JWT_PUBLIC_KEY in production.
# Accepted formats: raw base64 (PKCS#8 for private, X.509/SPKI for public) OR
# PEM with headers (-----BEGIN PRIVATE KEY----- / -----BEGIN PUBLIC KEY-----).
# When unset an ephemeral in-memory key pair is generated at startup (development
# only; tokens are invalidated on restart).
app.jwt.issuer=${JWT_ISSUER:school-guardian-iam}
app.jwt.audience=${JWT_AUDIENCE:school-guardian-api}
app.jwt.key-id=${JWT_KEY_ID:sg-iam}
app.jwt.private-key=${JWT_PRIVATE_KEY:}
app.jwt.public-key=${JWT_PUBLIC_KEY:}
app.jwt.access-token-expiration-minutes=60
app.jwt.refresh-token-expiration-days=7

# Security: BCrypt strength (default 10, can be 8-12 for faster hashing in high-load scenarios)
app.security.bcrypt-strength=10

# Servidor gRPC interno (contratos src/main/proto/internal_profile.proto iam.v1
# consumido por sg-ms-forgot-information y src/main/proto/profile.proto
# usermanagement.v1 consumido por sg-ms-fleet). Puerto dedicado h2c (5001), sin
# TLS porque el trafico no sale de la red de Docker. La clave compartida llega
# por APP_INTERNAL_API_KEY (relaxed binding -> app.internal.api-key).
grpc.server.port=${GRPC_SERVER_PORT:5001}
grpc.server.enabled=${GRPC_SERVER_ENABLED:true}
app.terms.current-version=2026.08
