# Configuracion de tests (CI y local).
#
# src/main/resources/application.properties esta en .gitignore, asi que en CI no
# existe y un @SpringBootTest fallaria con "Failed to determine a suitable driver
# class". Este archivo lo reemplaza en el classpath de test con un H2 en memoria
# en modo compatibilidad MSSQL, sin dependencias externas.
spring.datasource.url=jdbc:h2:mem:ms-iam-test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Los consumers de Kafka reintentan en background; no bloquean el arranque.
spring.kafka.bootstrap-servers=localhost:9092

# No levantar el servidor gRPC h2c en los tests.
grpc.server.enabled=false

# JWT test keys (generated for CI) - single-line base64
app.jwt.private-key=${JWT_PRIVATE_KEY:}
app.jwt.public-key=${JWT_PUBLIC_KEY:}
app.jwt.issuer=school-guardian-iam
app.jwt.audience=school-guardian-api
app.jwt.key-id=sg-iam
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=7

# RemoteIpValve: X-Forwarded-For solo de proxies internos (Docker / privada).
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1
